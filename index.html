<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="이하영의 Offbeat 웹앱 포탈 — 업무용 웹앱 바로가기">
  <title>이하영의 Offbeat 웹앱 포탈</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/>
      <path d="M14 3v5h4M9 12h6M9 16h6"/>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7v5l3.5 2.5"/>
    </symbol>
    <symbol id="icon-landmark" viewBox="0 0 24 24">
      <path d="m3 9 9-5 9 5H3ZM4 20h16M3 22h18M6 10v9M11 10v9M16 10v9"/>
    </symbol>
    <symbol id="icon-partners" viewBox="0 0 24 24">
      <circle cx="8.5" cy="8" r="3"/>
      <path d="M2.5 20v-2a6 6 0 0 1 12 0v2H2.5Z"/>
      <path d="M16.5 5.5a3 3 0 0 1 0 5.8M18 14a5 5 0 0 1 3.5 4.8V20H17"/>
    </symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24">
      <path d="M12 2.5 20 6v5.7c0 4.5-3 7.7-8 9.8-5-2.1-8-5.3-8-9.8V6l8-3.5Z"/>
      <path d="m8.5 12 2.4 2.4 4.7-5"/>
    </symbol>
    <symbol id="icon-chart" viewBox="0 0 24 24">
      <path d="M3 20h18M5 15v5M10 12v8M15 9v11M20 5v15"/>
      <path d="m4 11 5-5 5 3 6-6"/>
    </symbol>
    <symbol id="icon-archive" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="5" rx="1"/>
      <path d="M5 9v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 14h4"/>
    </symbol>
    <symbol id="icon-calculator" viewBox="0 0 24 24">
      <rect x="5" y="2" width="14" height="20" rx="2"/>
      <path d="M8 6h8v4H8zM8 14h1M12 14h1M16 14h.01M8 18h1M12 18h1M16 18h.01"/>
    </symbol>
  </svg>
  <a class="skip-link" href="#apps">웹앱 목록으로 이동</a>
  <div class="site-shell">
    <header class="page-header">
      <p class="eyebrow">OFFBEAT / WEB APPS</p>
      <h1>이하영의 Offbeat 웹앱 포탈</h1>
      <p class="subtitle">업무용 웹앱 바로가기</p>
    </header>

    <main id="apps">
      <nav aria-label="업무용 웹앱 목록">
        <ul class="app-list">
          <li class="app-item">
            <a class="app-link" href="https://offbeat-document-hub.vercel.app/" target="_blank" rel="noopener noreferrer">
              <svg class="app-icon" aria-hidden="true" focusable="false"><use href="#icon-document"></use></svg>
              <span class="app-name">계약서 및 주요문서 관리</span>
            </a>
          </li>
          <li class="app-item">
            <a class="app-link" href="https://offbeat-working-hours-dashboard.vercel.app/" target="_blank" rel="noopener noreferrer">
              <svg class="app-icon" aria-hidden="true" focusable="false"><use href="#icon-clock"></use></svg>
              <span class="app-name">임직원 근무시간 현황</span>
            </a>
          </li>
          <li class="app-item">
            <a class="app-link" href="https://offbeat-management-admin.vercel.app/" target="_blank" rel="noopener noreferrer">
              <svg class="app-icon" aria-hidden="true" focusable="false"><use href="#icon-landmark"></use></svg>
              <span class="app-name">오프비트 주주/ 스톡옵션 관리</span>
            </a>
          </li>
          <li class="app-item">
            <a class="app-link" href="https://partners.offbeatplay.com/projects" target="_blank" rel="noopener noreferrer">
              <svg class="app-icon" aria-hidden="true" focusable="false"><use href="#icon-partners"></use></svg>
              <span class="app-name">파트너스 포탈</span>
            </a>
          </li>
          <li class="app-item">
            <a class="app-link" href="https://partners.offbeatplay.com/admin/users" target="_blank" rel="noopener noreferrer">
              <svg class="app-icon" aria-hidden="true" focusable="false"><use href="#icon-shield"></use></svg>
              <span class="app-name">파트너스 포탈(어드민)</span>
            </a>
          </li>
          <li class="app-item">
            <a class="app-link" href="https://offbeat-review-dashboard.vercel.app/dashboard" target="_blank" rel="noopener noreferrer">
              <svg class="app-icon" aria-hidden="true" focusable="false"><use href="#icon-chart"></use></svg>
              <span class="app-name">인사평가 결과 분석 리포트</span>
            </a>
          </li>
          <li class="app-item">
            <a class="app-link" href="https://github.com/gitorvreport/orv-report" target="_blank" rel="noopener noreferrer">
              <svg class="app-icon" aria-hidden="true" focusable="false"><use href="#icon-archive"></use></svg>
              <span class="app-name">깃헙 전독시 리포트 아카이빙</span>
            </a>
          </li>
          <li class="app-item">
            <a class="app-link" href="https://fp.2hayoung.com/" target="_blank" rel="noopener noreferrer">
              <svg class="app-icon" aria-hidden="true" focusable="false"><use href="#icon-calculator"></use></svg>
              <span class="app-name">매출 프로젝션 시뮬레이터</span>
            </a>
          </li>
        </ul>
      </nav>
    </main>

    <footer class="page-footer">OFFBEAT © 2026</footer>
  </div>
</body>
</html>
